[versions]
# Plugins
agp = "8.5.2"
kotlin = "2.0.21"
jb-compose = "1.7.3"
maven-publish = "0.30.0"

# Libs
core-ktx = "1.13.1"
activity-compose = "1.9.3"
test-ext = "1.2.1"
test-espresso = "3.6.1"
junit = "4.13.2"
junit-compose = "1.7.6"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jb-compose" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
vanniktech-maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }


[libraries]
androidx-core = { group = "androidx.core", name = "core-ktx", version.ref = "core-ktx" }
androidx-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose"}
androidx-test-ext = { group = "androidx.test.ext", name = "junit-ktx", version.ref = "test-ext" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "test-espresso"}
compose-ui-junit = { group = "androidx.compose.ui", name = "ui-test-junit4", version.ref = "junit-compose"}
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "junit-compose"}
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest", version.ref = "junit-compose"}
junit = { module = "junit:junit", version.ref = "junit" }
